<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src https://api.vk.com https://vk.com https://vk.ru; base-uri 'none'; form-action 'none'">
  <title>Получение ключа VK</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      padding: 22px;
      background: #f2f5f9;
      color: #1f2937;
      font: 16px/1.5 Arial, sans-serif;
    }
    .card {
      max-width: 560px;
      margin: 24px auto;
      padding: 28px;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 10px 34px rgba(15, 23, 42, .10);
    }
    h1 { margin: 0 0 12px; font-size: 26px; line-height: 1.2; }
    p { margin: 0 0 18px; }
    button {
      width: 100%;
      padding: 13px 18px;
      border: 0;
      border-radius: 10px;
      background: #0077ff;
      color: #fff;
      font: 700 16px Arial, sans-serif;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: default; }
    button.secondary { margin-top: 10px; background: #e8f1ff; color: #0067dc; }
    .token-wrap { display: none; margin-top: 18px; }
    .token-wrap.visible { display: block; }
    input {
      width: 100%;
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      color: #334155;
      background: #f8fafc;
      font: 14px monospace;
    }
    #status { min-height: 48px; margin-top: 16px; color: #475569; }
    .ok { color: #166534 !important; }
    .error { color: #b91c1c !important; }
    .small { margin-top: 14px; color: #64748b; font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Получение ключа VK</h1>
    <p>VK запросит доступ только к администрируемым сообществам и доступной вам статистике.</p>
    <button id="connect" type="button" disabled>Получить ключ VK</button>
    <div id="status">Подготавливаю подключение…</div>
    <div id="tokenWrap" class="token-wrap">
      <input id="token" type="password" readonly autocomplete="off" aria-label="Ключ VK">
      <button id="copy" class="secondary" type="button">Скопировать ключ</button>
      <p class="small">После копирования вернитесь в Google-таблицу, откройте «Автоотчёт» → «Посчитать всё» и вставьте ключ.</p>
    </div>
  </main>
  <script src="./vk-bridge.min.js?v=2"></script>
  <script src="./app.js?v=2"></script>
</body>
</html>
